framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: false
    handle_all_throwables: true

    # L'application est francophone et exploitee au Benin. Sans ce reglage,
    # les dates ecrites en toutes lettres sortaient en anglais
    # (« Saturday 21 november 2026 ») sur l'espace donneur.
    default_locale: fr
    enabled_locales: ['fr']

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    php_errors:
        log: true

    # Pas de CDN : tous les actifs sont servis depuis public/.
    assets:
        json_manifest_path: null

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
