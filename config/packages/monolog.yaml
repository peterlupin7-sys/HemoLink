monolog:
    channels:
        - deprecation
        - sms
        - stock

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                channels: ['!event']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: fichier
                excluded_http_codes: [404, 405]
                buffer_size: 50
            fichier:
                type: rotating_file
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                max_files: 14
            # Les envois de SMS gardent leur propre journal, lisible par le CNTS.
            sms:
                type: rotating_file
                path: '%kernel.logs_dir%/sms.log'
                level: info
                channels: ['sms']
                max_files: 30
            console:
                type: console
                process_psr_3_messages: false

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: tampon
            tampon:
                type: test
                level: debug
