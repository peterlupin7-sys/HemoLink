<text x="1146" y="548" font-size="10.6" fill="#475569" text-anchor="start">PHPUnit : tests des services critiques</text>
<text x="1146" y="565" font-size="10.6" fill="#475569" text-anchor="start">Monolog : journal des actions sensibles</text>
<text x="1146" y="582" font-size="10.6" fill="#475569" text-anchor="start">Profiler en développement</text>
<text x="1146" y="599" font-size="10.6" fill="#475569" text-anchor="start">Variables d’environnement (.env)</text>
<rect x="90" y="655" width="1520" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<text x="110" y="682" font-size="12.4" fill="#16a34a" text-anchor="start" font-weight="700">Fonctionnement hors ligne</text>
<text x="110" y="706" font-size="10.6" fill="#475569" text-anchor="start">• Tout est installé en local : aucune requête vers un service en ligne n’est nécessaire pour afficher la carte ou consulter un stock.</text>
<text x="110" y="725" font-size="10.6" fill="#475569" text-anchor="start">• Si les tuiles de carte manquent, l’application bascule automatiquement sur la liste des banques triées par distance.</text>
<text x="110" y="744" font-size="10.6" fill="#475569" text-anchor="start">• Les SMS non partis sont conservés dans la file Messenger et envoyés dès le retour du réseau.</text>
