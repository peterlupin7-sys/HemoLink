<text x="106" y="548" font-size="10.6" fill="#475569" text-anchor="start">Firewall et authentification par formulaire</text>
<text x="106" y="565" font-size="10.6" fill="#475569" text-anchor="start">Rôles : ROLE_ADMIN, ROLE_GESTIONNAIRE,</text>
<text x="106" y="582" font-size="10.6" fill="#475569" text-anchor="start">ROLE_AGENT · Voters pour l’accès par banque</text>
