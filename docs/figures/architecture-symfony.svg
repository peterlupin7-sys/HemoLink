<text x="1146" y="373" font-size="10.6" fill="#475569" text-anchor="start">Doctrine ORM : 14 entités mappées</text>
<text x="1146" y="390" font-size="10.6" fill="#475569" text-anchor="start">Repositories : requêtes DQL et SQL natives</text>
<text x="1146" y="407" font-size="10.6" fill="#475569" text-anchor="start">Migrations : création et évolution du schéma</text>
