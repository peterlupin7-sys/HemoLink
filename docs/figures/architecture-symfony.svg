<text x="40" y="40" font-size="22" fill="#0f172a" text-anchor="start" font-weight="700">HemoLink v1.0 — Architecture technique (Symfony)</text>
<text x="1660" y="40" font-size="12.5" fill="#64748b" text-anchor="end">Modèle en couches · MVC Symfony + Doctrine ORM · fonctionnement local</text>
