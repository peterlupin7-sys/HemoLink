<text x="626" y="565" font-size="10.6" fill="#475569" text-anchor="start">réémission après une coupure réseau</text>
<text x="626" y="582" font-size="10.6" fill="#475569" text-anchor="start">Console : app:sauvegarde, app:alerte-peremption</text>
<text x="626" y="599" font-size="10.6" fill="#475569" text-anchor="start">Planification quotidienne (tâche programmée)</text>
