<text x="80" y="300" font-size="13.2" fill="#be123c" text-anchor="start" font-weight="700">SERVEUR LOCAL — Apache (XAMPP) + PHP 8.2</text>
<text x="1620" y="300" font-size="11.5" fill="#64748b" text-anchor="end" font-style="italic">application Symfony</text>
